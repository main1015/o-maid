<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="sidepanelTitle"></title>
    <link rel="stylesheet" href="styles/sidepanel.css">
</head>

<body>
    <div id="sidepanel-root">
        <div id="sidepanel-header">
            <span id="header-title" data-i18n="sidepanelTitle"></span>
            <div>
                <button id="auth-btn" data-i18n-title="btnCloudAuth">👤</button>
                <button id="settings-btn" data-i18n-title="btnSettings">⚙️</button>
                <button id="export-btn" data-i18n-title="btnExport">📤</button>
                <button id="import-btn" data-i18n-title="btnImport">📥</button>
                <button id="add-new-btn" data-i18n-title="btnAdd">+</button>
            </div>
        </div>
        <div id="notification" style="display:none;"></div>
        <div id="sidepanel-content">
            <!-- Tabs -->
            <div id="main-tabs" class="tabs" style="display: flex; gap: 10px; margin-bottom: 10px;">
                <button class="tab-btn active" data-tab="local" style="flex: 1; padding: 5px;" data-i18n="tabLocal"></button>
                <button class="tab-btn" data-tab="cloud" style="flex: 1; padding: 5px;" data-i18n="tabCloud"></button>
            </div>

            <!-- View: Main list view -->
            <div id="view-main" class="tab-content active">
                <div class="list-section">
                    <h4 class="collapsible active" data-target="tours-list"><span data-i18n="titleTours"></span> <span class="arrow"></span></h4>
                    <ul id="tours-list"></ul>
                </div>
                <div class="list-section">
                    <h4 class="collapsible active" data-target="hints-list"><span data-i18n="titleHints"></span> <span class="arrow"></span></h4>
                    <ul id="hints-list"></ul>
                </div>
                <p id="no-data-msg" style="display:none;" data-i18n="msgNoData"></p>
            </div>

            <!-- View: Cloud Discover -->
            <div id="view-cloud" class="tab-content" style="display:none;">
                <div class="list-section">
                    <h4 class="collapsible active" data-target="cloud-tours-list"><span data-i18n="titleCloudTours"></span> <span class="arrow"></span></h4>
                    <ul id="cloud-tours-list"></ul>
                </div>
                <div class="list-section">
                    <h4 class="collapsible active" data-target="cloud-hints-list"><span data-i18n="titleCloudHints"></span> <span class="arrow"></span></h4>
                    <ul id="cloud-hints-list"></ul>
                </div>
                <button id="refresh-cloud-btn" class="choice-btn" data-i18n="btnRefreshCloud"></button>
                <p id="cloud-no-data-msg" style="display:none;" data-i18n="msgCloudNoData"></p>
            </div>

            <!-- View: Auth -->
            <div id="view-auth" style="display:none;">
                <h5 data-i18n="titleAuth"></h5>
                <div id="auth-status" style="margin-bottom: 10px; font-size: 14px; color: #666;"></div>
                <div id="auth-form-container">
                    <input type="text" id="auth-username" data-i18n-placeholder="placeholderUsername" style="width: 100%; margin-bottom: 8px; padding: 6px; box-sizing: border-box;">
                    <input type="password" id="auth-password" data-i18n-placeholder="placeholderPassword" style="width: 100%; margin-bottom: 8px; padding: 6px; box-sizing: border-box;">
                    <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                        <button id="login-btn" class="choice-btn" style="flex: 1; margin: 0;" data-i18n="btnLogin"></button>
                        <button id="register-btn" class="choice-btn" style="flex: 1; margin: 0;" data-i18n="btnRegister"></button>
                    </div>
                </div>
                <button id="logout-btn" class="choice-btn" style="display:none; width: 100%; margin-bottom: 10px;" data-i18n="btnLogout"></button>
                <hr>
                <button id="close-auth-btn" class="cancel-btn" data-i18n="btnClose"></button>
            </div>

            <!-- View: Settings -->
            <div id="view-settings" style="display:none;">
                <h5 data-i18n="titleSettings"></h5>
                <label data-i18n="labelApiBase"></label>
                <input type="text" id="setting-api-base" placeholder="http://localhost:3000/api" style="width: 100%; margin-bottom: 10px; padding: 6px; box-sizing: border-box;">
                <button id="save-settings-btn" class="save-btn" style="width: 100%; margin-bottom: 10px;" data-i18n="btnSaveSettings"></button>
                <hr>
                <button id="close-settings-btn" class="cancel-btn" data-i18n="btnCloseSettings"></button>
            </div>

            <!-- View: Add Choice -->
            <div id="view-add-choice" style="display:none;">
                <h5 data-i18n="titleAddChoice"></h5>
                <button id="create-hint-btn" class="choice-btn" data-i18n="btnCreateHint"></button>
                <button id="create-tour-btn" class="choice-btn" data-i18n="btnCreateTour"></button>
                <hr><button id="cancel-creation-btn" class="cancel-btn" data-i18n="btnCancel"></button>
            </div>

            <!-- View: Hint Editor -->
            <div id="view-edit-hint" style="display:none;">
                <label data-i18n="labelHintText"></label>
                <textarea id="hint-text" rows="4"></textarea>
                <label data-i18n="labelCssSelector"></label>
                <div class="selector-wrapper">
                    <input type="text" id="hint-selector" readonly>
                    <button id="hint-reselect-btn" data-i18n="btnReselect"></button>
                </div>
                <div class="form-actions">
                    <button id="save-hint-btn" class="save-btn" data-i18n="btnSave"></button>
                    <button id="cancel-edit-hint-btn" class="cancel-btn" data-i18n="btnCancelEditHint"></button>
                </div>
            </div>

            <!-- View: Tour Editor -->
            <div id="view-edit-tour" style="display:none;">
                <label data-i18n="labelTourName"></label>
                <input type="text" id="tour-name">
                <label data-i18n="labelTourTrigger"></label>
                <select id="tour-trigger">
                    <option value="manual" data-i18n="optionManual"></option>
                    <option value="auto" data-i18n="optionAuto"></option>
                </select>
                <div class="list-section">
                    <h5><span data-i18n="titleSteps"></span> (<span id="tour-step-count">0</span>)</h5>
                    <ul id="tour-steps-list"></ul>
                </div>
                <button id="tour-add-step-btn" class="choice-btn" data-i18n="btnAddStep"></button>
                <div class="form-actions">
                    <button id="save-tour-btn" class="save-btn" data-i18n="btnSaveTour"></button>
                    <button id="cancel-edit-tour-btn" class="cancel-btn" data-i18n="btnCancelEditTour"></button>
                </div>
            </div>

            <!-- View: Tour Step Editor -->
            <div id="view-edit-tour-step" style="display:none;">
                <label data-i18n="labelStepText"></label>
                <textarea id="tour-step-text" rows="4"></textarea>
                <label data-i18n="labelStepSelector"></label>
                <div class="selector-wrapper">
                    <input type="text" id="tour-step-selector" readonly>
                    <button id="tour-step-reselect-btn" data-i18n="btnStepReselect"></button>
                </div>
                <div class="form-actions">
                    <button id="save-tour-step-btn" class="save-btn" data-i18n="btnSaveStep"></button>
                    <button id="cancel-edit-tour-step-btn" class="cancel-btn" data-i18n="btnCancelEditStep"></button>
                </div>
            </div>
        </div>
    </div>
    <input type="file" id="import-input" accept=".json" style="display:none;">
    <script src="sidepanel.js" type="module"></script>
</body>

</html>
